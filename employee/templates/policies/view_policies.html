{% extends 'index.html' %}
{% block content %}
{% load i18n %}
{% load static %}
<style>
  .oh-policy-breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 24px;
    font-size: 15px;
  }
  .oh-policy-breadcrumb a {
    color: #6c757d;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .oh-policy-breadcrumb a:hover {
    color: var(--oh-primary, #dc3545);
    text-decoration: underline;
  }
  .oh-policy-breadcrumb__separator {
    color: #adb5bd;
  }
  .oh-policy-breadcrumb__current {
    font-weight: 600;
    color: #212529;
  }
  .oh-policy-section-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #868e96;
    margin: 8px 0 12px;
  }
  .oh-policy-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .oh-policy-folder {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    background: #fff;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    cursor: pointer;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .oh-policy-folder:hover {
    border-color: #ced4da;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
  }
  .oh-policy-folder__icon {
    font-size: 32px;
    color: #ffc107;
    display: flex;
  }
  .oh-policy-folder__body {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
  }
  .oh-policy-folder__name {
    font-weight: 600;
    color: #212529;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .oh-policy-folder__meta {
    font-size: 12px;
    color: #868e96;
  }
  .oh-policy-folder__actions,
  .oh-policy-file__actions {
    display: flex;
    gap: 10px;
    font-size: 18px;
  }
  .oh-policy-folder__actions a,
  .oh-policy-file__actions a {
    color: #868e96;
    display: flex;
  }
  .oh-policy-folder__actions a:hover,
  .oh-policy-file__actions a:hover {
    color: #212529;
  }
  .oh-policy-folder__actions a.text-danger:hover,
  .oh-policy-file__actions a.text-danger:hover {
    color: #dc3545 !important;
  }
  .oh-policy-file {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: #fff;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .oh-policy-file:hover {
    border-color: #ced4da;
  }
  .oh-policy-file__icon {
    font-size: 26px;
    color: #dc3545;
    display: flex;
  }
  .oh-policy-file__icon--word {
    color: #2b579a;
  }
  .oh-policy-file__icon--excel {
    color: #217346;
  }
  .oh-policy-file__body {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
  }
  .oh-policy-file__name {
    font-weight: 500;
    color: #212529;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .oh-policy-file__meta {
    font-size: 12px;
    color: #868e96;
  }
  .oh-policy-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 0;
    color: #868e96;
  }
  .oh-policy-empty ion-icon {
    font-size: 56px;
    color: #ced4da;
    margin-bottom: 12px;
  }
</style>
{% include 'policies/nav.html' %}
<div class="oh-wrapper" id="policyContainer">
  {% include 'policies/explorer.html' %}
</div>
{% endblock %}
