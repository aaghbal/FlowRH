{% load i18n %}
{% load basefilters %}
<div id="ack-message-{{cand.id}}">
</div>
<div class="oh-modal__dialog-header">
  <span class="oh-modal__dialog-title" id="sendMailModalLabel"><h5>{% trans 'Envoyer' %}</h5></span>
  <button class="oh-modal__close" aria-label="Close"><ion-icon name="close-outline"></ion-icon></button>
</div>
<div class="oh-modal__dialog-body">
<form onsubmit="$(this).closest('.oh-modal--show').removeClass('oh-modal--show')"
  hx-post='{% url "send-acknowledgement" %} '
  hx-swap="none"
  class="oh-general__tab-target oh-profile-section"
  id='ack-form-{{cand.id}}'
  hx-target="#ack-message-{{cand.id}}"
  hx-encoding="multipart/form-data">
  <input type="hidden" value="{{cand.id}}" name="id">
  <div class="modal-body">
    {% if cand %}
    <div class="oh-timeoff-modal__profile-content">
      <div class="oh-profile mb-2">
        <div class="oh-profile__avatar">
          <img src="{{ cand.name|initials_avatar }}"
            class="oh-profile__image me-2">
        </div>
        <div class="oh-timeoff-modal__profile-info">
          <span class="oh-timeoff-modal__user fw-bold">{{cand.name}}</span>
          <span class="oh-timeoff-modal__user m-0" style="font-size: 18px; color: #4d4a4a">
            {{cand.job_position_id.job_position}} /
            {{cand.recruitment_id}}</span>
        </div>
      </div>
    </div>
    <div class="form-group mt-2">
      <label for="to">
        <h6>{% trans "To" %}</h6>
      </label>
      <input required type="text" value="{{cand.email}}" name='to' class="oh-input w-100" id="to"
        placeholder="Subject">
    </div>
    {% endif %}
    <div class="form-group mt-2">
      <label for="candidates">
        <h6>{% trans "Transmettre aussi à" %}</h6>
      </label>
      <select class="oh-select oh-select-2" {% if not cand %} required {% endif %} name="candidates" id="candidates" multiple>
        {% for cand in candidates %}
          <option value="{{cand.id}}">{{cand}}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group mt-2">
      <label for="subject">
        <h6>{% trans "Subject" %}</h6>
      </label>
      <input required type="text" placeholder="Congrats..." name='subject' class="oh-input w-100" id="subject"
        placeholder="Subject">
    </div>
    <div class="form-group mt-2">
      <label for="template">
        <h6>{% trans "Modèle" %}</h6>
      </label>
      <select name="template" class="w-100 oh-select" id="template">
        <option value="">----</option>
        {% for template in templates %}
        <option value="{{template.id}}">{{template.title}}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group mt-2">
      <label for="body">
        <h6>{% trans "Corps du message" %}</h6>
      </label>
      <textarea hidden name="body" {% if not cand %} data-summernote {% endif %} required class="oh-input w-100" id="body" cols="30"
        rows="2"></textarea>
    </div>
    {% if perms.base.add_horillamailtemplate %}
    <div class="form-group mt-2">
      <div class="d-flex gap-2 align-items-center">
        <input type="text" maxlength="25" class="oh-input w-100" id="new-template-title-{{cand.id}}"
          placeholder="{% trans 'Titre du nouveau modèle' %}">
        <button type="button" class="oh-btn oh-btn--light-bkg" style="white-space: nowrap;"
          onclick="saveAsMailTemplate('{{cand.id}}')">
          <ion-icon name="add-outline" class="me-1"></ion-icon>{% trans "Enregistrer comme modèle" %}
        </button>
      </div>
    </div>
    {% endif %}
    <div class="form-group mt-2">
      <label for="template_attachments">
        <h6>{% trans "Modèle en pièce jointe" %}</h6>
      </label>
      <select name="template_attachments" class="w-100 oh-select" id="template_attachments" multiple>
        {% for template in templates %}
        <option value="{{template.id}}">{{template.title}}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group mt-2">
      <label for="other_attachments">
        <h6>{% trans "Autres documents" %}</h6>
      </label>
      <input type="file" name="other_attachments" id="other_attachments" multiple style="display: block;">
    </div>
    <div class="modal-footer d-flex flex-row-reverse mt-3">
      <input type="submit" class="oh-btn oh-btn--secondary submit-send" data-message-id="ack-message-{{cand.id}}"
        name="submit" id="submit" onclick="sendMail()" value="{% trans 'Envoyer' %}">
    </div>
</form>
</div>

<script>
{% if stage_id %}
  $(document).ready(function () {
    var idsArray = $("#candidateContainer{{stage_id}}")
    .find(".candidate-checkbox[type=checkbox]:checked")
    .map(function() {
        return this.id;
    }).get();
    $("#candidates").val(idsArray).change()
  });
{% else %}
  var selectedIds = JSON.parse($("#selectedInstances").attr("data-ids"));
  $("#candidates[name=candidates]select[multiple]").val(selectedIds).change()
{% endif %}
</script>

<script>
  button = document.querySelector('.submit-send')
  button.onclick = function (event) {
    var element = event.target;
    var valid = true

    if (!$('#candidates').val().length && "{{cand|default:'false'|safe}}"=="false") {
      valid=false
      $(`#messages`).html($(`
      <div class="oh-alert oh-alert--animated oh-alert--danger" role="alert">
        This field is required
        </div>
        `));
    }
    else if (!$("#subject").val().length) {
      valid=false
      $(`#messages`).html($(`
      <div class="oh-alert oh-alert--animated oh-alert--danger" role="alert">
        The message subject is required
        </div>
        `));
    }
    else if (!$("#body").val().length) {
      valid=false
      $(`#messages`).html($(`
      <div class="oh-alert oh-alert--animated oh-alert--danger" role="alert">
        The message body is required
        </div>
        `));
    }
    if (valid) {
      Swal.fire({
        title: "Traitement...",
        text: "L'e-mail sera envoyé en arrière-plan.",
        icon: "info"
      });
    }
  };
  function saveAsMailTemplate(formId) {
    var form = $(`#ack-form-${formId}`);
    var title = $(`#new-template-title-${formId}`).val().trim();
    var body = form.find(".note-editable").html() || form.find('[name="body"]').val();
    if (!title.length || !$("<div>").html(body).text().trim().length) {
      Swal.fire({ icon: "warning", text: "{% trans 'Le titre et le corps du message sont requis' %}" });
      return;
    }
    $.ajax({
      type: "post",
      url: "{% url 'quick-create-mail-template' %}",
      data: { title: title, body: body, csrfmiddlewaretoken: "{{ csrf_token }}" },
      dataType: "json",
      success: function (response) {
        var option = new Option(response.title, response.id);
        form.find("#template").append(option).val(response.id);
        form.find("#template_attachments").append(new Option(response.title, response.id));
        $(`#new-template-title-${formId}`).val("");
        Swal.fire({ icon: "success", text: "{% trans 'Modèle créé' %}", timer: 1500, showConfirmButton: false });
      },
      error: function (xhr) {
        var errors = (xhr.responseJSON && xhr.responseJSON.errors) || ["{% trans 'Erreur lors de la création du modèle' %}"];
        Swal.fire({ icon: "error", text: errors.join("\n") });
      }
    });
  }

  $(document).ready(function () {
    $("#template").change(function (e) {
      var id = $(this).val();
      if (id.length) {
        $.ajax({
          type: "get",
          url: `/recruitment/get-template/${id}/`,
          data: { "candidate_id": "{{cand.id}}" },
          dataType: "Json",
          success: function (response) {
            $('#ack-form-{{cand.id}} [name="body"]').html(response.body).change()
            $('#ack-form-{{cand.id}} [class="note-editable"]').html(response.body)
          }
        });
      }
    });
  });
</script>
<script>

  {% if form.instance.title %}
  setModalLabel("{{ form.instance.title|escapejs }}", "#viewTemplateModalLabel");
  {% endif %}
  initializeSummernote({{cand.id}},{{ searchWords|safe }});

</script>
